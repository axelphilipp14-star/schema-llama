# Traces de Llama 3.2 (3B Instruct, 3B base, 1B Instruct) sur CPU — remplace le notebook Kaggle (tâche déléguée par Axel le 24/11/2026).
name: traces
on:
  workflow_dispatch:
    inputs:
      models:
        description: "clé=dépôt, séparés par des espaces"
        default: "3b-instruct=unsloth/Llama-3.2-3B-Instruct 3b-base=unsloth/Llama-3.2-3B 1b-instruct=unsloth/Llama-3.2-1B-Instruct"
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dépendances (torch CPU)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.46" accelerate
          free -g; nproc; df -h / | tail -1
      - name: Traces
        run: python scripts/trace_batch.py --out traces --clear-cache --models ${{ inputs.models }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: traces, path: traces/ }
